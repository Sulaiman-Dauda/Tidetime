version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # Bundle updates so Dependabot opens a couple of tidy PRs instead of one
    # branch per dependency. Safe minor/patch bumps are grouped together; major
    # bumps are grouped separately so they still get individual review.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    # Majors that need a planned migration, not a bump. TypeScript 7 is not yet
    # supported by typescript-eslint, Tailwind 4 moves its config into CSS and
    # tailwind-merge 3 needs Tailwind 4, and @types/node follows the Node the
    # Dockerfile runs (22). Remove an entry when that upgrade is planned.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

# Rebuilds tidetime.app whenever the documentation changes. The site pulls
# /docs from this repo at build time rather than keeping its own copy, so a
# docs change here needs a build there.
#
# This uses a Cloudflare Pages deploy hook rather than a GitHub token. The hook
# is a single secret URL that can only start a build of one Pages project, a far
# less valuable secret to hold in a public repository than a token with
# dispatch rights. The previous version dispatched to the website repo with a
# token that was never set, so it skipped every run while reporting success.
#
# Secret: CF_PAGES_DEPLOY_HOOK
name: Rebuild the documentation site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

# Nothing here reads or writes repository contents.
permissions: {}

concurrency:
  group: docs-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    # Forks have no hook to call; only the upstream repo publishes the site.
    if: github.repository == 'Sulaiman-Dauda/Tidetime'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Pages build
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::CF_PAGES_DEPLOY_HOOK is not set, so tidetime.app will not pick up this docs change."
            exit 1
          fi
          # -f so a non-2xx is a real failure rather than a silent success.
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "::notice::Documentation site rebuild triggered."

name: Publish Docker image

# Builds the production image once on GitHub's runners and publishes it to
# GHCR, so self-hosters pull a prebuilt image instead of compiling on their
# own (often tiny) servers. install.sh pulls ghcr.io/<repo>:latest by default
# and only falls back to building from source if the pull fails.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Building is required: a broken Dockerfile fails the workflow.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publishing is best-effort. The first push to a new GHCR package name can
      # be denied until the package is created and its "Actions access" grants
      # this repository write permission (GitHub Packages settings). Until then,
      # install.sh builds from source, so a denied push does not break installs.
      - name: Publish image to GHCR
        id: publish
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Note if publish was skipped
        if: steps.publish.outcome != 'success'
        run: |
          echo "::warning::Image build succeeded but the GHCR push was denied."
          echo "Grant this repository write access to the ghcr.io/${{ github.repository_owner }}/tidetime package,"
          echo "or delete a stale package of that name, then re-run. install.sh builds from source meanwhile."

# Cap container log growth — Docker's default json-file driver is unbounded
# and will eventually fill the host disk on a long-running deployment.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tidetime}
    volumes:
      - tidetime_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tidetime}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    image: ${TIDETIME_IMAGE:-tidetime:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tidetime}
      PORT: 3100
    volumes:
      # Channel to the optional updater sidecar (docker-compose.updater.yml).
      # The app only writes an update request and reads a heartbeat here; it
      # never gets Docker access itself.
      - tidetime_update:/var/run/tidetime
    # Migrations run on boot. Safe at the supported single app replica; running
    # multiple app replicas would race the migrator and needs a separate
    # migrate step instead.
    command: sh -c "node scripts/migrate-runtime.mjs && node server.js"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      # Keep the application port local. Remote traffic must pass through
      # Caddy, which normalizes forwarding headers before rate limiting.
      - "127.0.0.1:${APP_PORT:-3000}:3100"

  jobs:
    image: ${TIDETIME_IMAGE:-tidetime:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED:-1}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-300}
    command: node scripts/jobs-worker.mjs
    healthcheck:
      # The worker touches its heartbeat file after every tick; a heartbeat
      # older than two intervals means the loop is wedged, not just slow.
      test:
        - CMD-SHELL
        - test $$(( $$(date +%s) - $$(stat -c %Y /tmp/jobs-heartbeat 2>/dev/null || echo 0) )) -lt $$(( 2 * $${JOBS_INTERVAL_SECONDS:-300} + 60 ))
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # HTTPS proxy for custom domains. When an admin saves a domain in
  # Dashboard → Settings and points its DNS at this server, Caddy obtains and
  # renews a Let's Encrypt certificate automatically (on-demand TLS, gated by
  # the app's /api/domain/verify endpoint). No cert files, no restarts.
  # Ports are overridable in case the host already runs a web server there.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - tidetime_caddy_data:/data
      - tidetime_caddy_config:/config

volumes:
  tidetime_pgdata:
  tidetime_caddy_data:
  tidetime_caddy_config:
  tidetime_update:

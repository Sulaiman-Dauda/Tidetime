services:
  postgres:
    image: postgres:18-alpine
    container_name: tidetime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tidetime
    ports:
      - "5432:5432"
    volumes:
      - tidetime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tidetime"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tidetime_pgdata:
